whisper:
  inference:
    ros__parameters:
      model_name: "tiny"      # Zurueck auf tiny, um Timeout/Performance-Probleme auszuschliessen
      wparams:
        language: "en"           # Sprache auf Englisch für englische Kommandos
        task: "transcribe"
        # Wichtig: Biasing auf Deine aktuellen Befehle als Transkript-Kontext
        initial_prompt: |
          You will hear voice commands. Valid triggers:
          - "Move to Pose"
          - "Move to Absolute Pose"
          - "Move to Initial Pose"
          - "Move to Pause"
        # Für stabile, deterministische Erkennung (niedrige Latenz)
        temperature: 0.0
        beam_size: 1             # Zurueck auf 1 (Greedy Decoding)
        best_of: 1
        no_timestamps: true
        condition_on_previous_text: false   # vermeidet “Hängenbleiben” im Kontext
        vad_filter: true                    # Falls Dein Server diese Option unterstützt
        # VAD-Feineinstellungen (vorerst wieder deaktiviert)
        # vad_parameters:
        #   min_silence_duration_ms: 250
        #   speech_pad_ms: 100

        print_progress: false
        n_threads: 4

      cparams:
        flash_attn: true
        gpu_device: 0
        use_gpu: true

      # Reaktionsfreudigkeit (kannst Du feinjustieren)
      buffer_capacity: 8        # kleiner = schnellere Entscheidungen (z.B. 6–10)
      callback_ms: 250          # häufigere Rückmeldungen (z.B. 200–300 ms)
