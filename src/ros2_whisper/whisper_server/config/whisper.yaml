whisper:
  inference:
    ros__parameters:
      # Multilingual (EN/DE). "small" transkribiert deutlich sauberer als "base"
      # und braucht auf der RTX A5000 ca. 50-120 ms pro Durchlauf.
      # Fehlt das Modell, wird es beim Start nach ~/.cache/whisper.cpp geladen.
      model_name: "small"
      wparams:
        language: "auto"         # Automatische Spracherkennung (Englisch/Deutsch)
        # Leer lassen! Mit Befehls-Prompt halluziniert Whisper bei Stille Text
        # ("Transcription by www...") und rechnet laenger (getestet).
        initial_prompt: ""
        # Stabile, deterministische Erkennung
        temperature: 0.0
        beam_size: 1             # > 1 = Beam Search; zu langsam fuer den 250-ms-Takt (getestet) -> Greedy
        best_of: 1               # nur bei Greedy
        no_context: true         # kein Vorgaengertext als Kontext - vermeidet "Haengenbleiben"
        # Hinweis: die eingebundene whisper.cpp-Version hat keinen VAD.

        print_progress: false
        n_threads: 4

      cparams:
        flash_attn: true
        gpu_device: 0
        use_gpu: true

      # Reaktionsfreudigkeit
      buffer_capacity: 6        # Sekunden Audio; Listener-Aufnahme dauert max. 5 s
      callback_ms: 250          # Takt der Inferenz (z.B. 200-300 ms)
      # Whisper rechnet nur so lange nach einem "listen"-Trigger der UI
      # (Listener-Goal dauert 5 s). 0 = Dauerbetrieb wie frueher.
      listen_window_ms: 7000
