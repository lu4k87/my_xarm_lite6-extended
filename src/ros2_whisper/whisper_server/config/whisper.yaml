whisper:
  inference:
    ros__parameters:
      model_name: "base"         # oder small/medium/large-v3, je nach GPU
      wparams:
        language: "de"           # Sprache auf Deutsch für deutsche Kommandos
        task: "transcribe"
        # Wichtig: Biasing auf Deine aktuellen Befehle
        initial_prompt: |
          You will hear voice commands. Valid triggers:
          - "Move to Pose"
          - "Move to Absolute Pose"
          - "Move to Absolute Position"
          - "Fahre zur Absolute Position"
          - "Absolute Position"
          - "Move to Initial Pose"
          - "Move to Initial Position"
          - "Fahre zur Initial Position"
          - "Initial Position"
          - "Initial Pose"
          - "Greife"
          - "Grasp"
          - "Move to"
          - "Go to"

        # Für stabile, deterministische Erkennung (niedrige Latenz)
        temperature: 0.0
        beam_size: 1
        best_of: 1
        no_timestamps: true
        condition_on_previous_text: false   # vermeidet “Hängenbleiben” im Kontext
        vad_filter: true                    # Falls Dein Server diese Option unterstützt
        # (Optional – je nach Whisper-Server verfügbar)
        # vad_parameters:
        #   min_silence_duration_ms: 250
        #   speech_pad_ms: 100

        print_progress: false
        n_threads: 4

      cparams:
        flash_attn: true
        gpu_device: 0
        use_gpu: true

      # Reaktionsfreudigkeit (kannst Du feinjustieren)
      buffer_capacity: 8        # kleiner = schnellere Entscheidungen (z.B. 6–10)
      callback_ms: 250          # häufigere Rückmeldungen (z.B. 200–300 ms)
