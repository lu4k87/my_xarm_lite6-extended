<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Quest 3 VR Teleop</title>
    <script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
    <style>
        body {
            font-family: monospace;
            background: #111;
            color: #eee;
            text-align: center;
            padding: 30px 20px;
            margin: 0;
        }
        h1 { color: #4fc3f7; font-size: 28px; margin-bottom: 10px; }
        #status-box {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            margin: 20px auto;
            max-width: 420px;
            border: 2px solid #333;
        }
        .label { color: #888; font-size: 13px; margin-bottom: 4px; }
        .value { font-size: 20px; font-weight: bold; margin-bottom: 16px; }
        #ros-status { color: orange; }
        #vr-status { color: #888; }
        button {
            font-size: 20px;
            padding: 14px 28px;
            cursor: pointer;
            border-radius: 10px;
            border: none;
            background: #4fc3f7;
            color: #111;
            font-weight: bold;
            margin-top: 10px;
            display: none;
        }
        #debug {
            margin-top: 20px;
            background: #1a1a1a;
            border-radius: 10px;
            padding: 16px;
            font-size: 14px;
            text-align: left;
            display: inline-block;
            min-width: 300px;
        }
        .debug-row { display: flex; justify-content: space-between; margin: 4px 0; }
        .debug-key { color: #888; }
        .debug-val { color: #4fc3f7; font-weight: bold; }
        #reconnect-info { font-size: 12px; color: #555; margin-top: 8px; }
    </style>
</head>
<body>
    <h1>Quest 3 Teleop</h1>

    <div id="status-box">
        <div class="label">ROS Connection</div>
        <div class="value" id="ros-status">Connecting...</div>
        <div class="label">VR Session</div>
        <div class="value" id="vr-status">Not started</div>
        <div id="reconnect-info"></div>
    </div>

    <button id="vr-btn" onclick="enterVR()">▶ Enter VR (Passthrough)</button>

    <div id="debug">
        <div class="debug-row"><span class="debug-key">Grip (Kupplung):</span><span class="debug-val" id="d-grip">–</span></div>
        <div class="debug-row"><span class="debug-key">Index (Greifer):</span><span class="debug-val" id="d-index">–</span></div>
        <div class="debug-row"><span class="debug-key">Thumbstick X:</span><span class="debug-val" id="d-thumb">–</span></div>
        <div class="debug-row"><span class="debug-key">Pos X/Y/Z:</span><span class="debug-val" id="d-pos">–</span></div>
        <div class="debug-row"><span class="debug-key">Msgs gesendet:</span><span class="debug-val" id="d-count">0</span></div>
    </div>

    <script>
        let ros = null;
        let vrTopic = null;
        let xrSession = null;
        let xrRefSpace = null;
        let msgCount = 0;
        let reconnectTimer = null;
        let reconnectAttempt = 0;

        function connectROS() {
            if (ros) {
                try { ros.close(); } catch(e) {}
            }
            reconnectAttempt++;
            document.getElementById('reconnect-info').innerText =
                reconnectAttempt > 1 ? `Versuch ${reconnectAttempt}...` : '';

            ros = new ROSLIB.Ros({ url: 'ws://127.0.0.1:9090' });

            ros.on('connection', () => {
                reconnectAttempt = 0;
                document.getElementById('ros-status').innerText = 'ROS Connected! ✅';
                document.getElementById('ros-status').style.color = '#66bb6a';
                document.getElementById('reconnect-info').innerText = '';
                clearTimeout(reconnectTimer);

                vrTopic = new ROSLIB.Topic({
                    ros: ros,
                    name: '/vr_teleop/controller_data',
                    messageType: 'std_msgs/String'
                });

                // Show Enter VR button if WebXR available
                if (navigator.xr) {
                    // Try passthrough (AR) first, fallback to immersive-vr
                    navigator.xr.isSessionSupported('immersive-ar').then(supported => {
                        if (supported) {
                            document.getElementById('vr-btn').innerText = '▶ Enter VR (Passthrough)';
                        } else {
                            document.getElementById('vr-btn').innerText = '▶ Enter VR';
                        }
                        document.getElementById('vr-btn').style.display = 'inline-block';
                        document.getElementById('vr-status').innerText = 'Bereit – Button drücken!';
                        document.getElementById('vr-status').style.color = '#ffa726';
                    });
                } else {
                    document.getElementById('vr-status').innerText = 'WebXR nicht verfügbar';
                    document.getElementById('vr-status').style.color = 'red';
                }
            });

            ros.on('error', (err) => {
                document.getElementById('ros-status').innerText = 'ROS Fehler ❌';
                document.getElementById('ros-status').style.color = 'red';
                scheduleReconnect();
            });

            ros.on('close', () => {
                document.getElementById('ros-status').innerText = 'Verbindung getrennt 🔄';
                document.getElementById('ros-status').style.color = 'orange';
                document.getElementById('vr-btn').style.display = 'none';
                scheduleReconnect();
            });
        }

        function scheduleReconnect() {
            clearTimeout(reconnectTimer);
            const delay = Math.min(3000, 1000 + reconnectAttempt * 500);
            document.getElementById('reconnect-info').innerText =
                `Nächster Versuch in ${Math.round(delay/1000)}s...`;
            reconnectTimer = setTimeout(connectROS, delay);
        }

        function enterVR() {
            // Try immersive-ar (passthrough) first, then fall back to immersive-vr
            navigator.xr.isSessionSupported('immersive-ar').then(supported => {
                const mode = supported ? 'immersive-ar' : 'immersive-vr';
                navigator.xr.requestSession(mode, {
                    requiredFeatures: ['local-floor'],
                    optionalFeatures: ['hand-tracking']
                }).then(session => {
                    xrSession = session;
                    session.addEventListener('end', () => {
                        xrSession = null;
                        document.getElementById('vr-status').innerText = 'Session beendet';
                        document.getElementById('vr-status').style.color = '#888';
                    });
                    session.requestReferenceSpace('local-floor').then(refSpace => {
                        xrRefSpace = refSpace;
                        document.getElementById('vr-status').innerText = 'VR aktiv – Grip drücken! 🟢';
                        document.getElementById('vr-status').style.color = '#66bb6a';
                        session.requestAnimationFrame(onXRFrame);
                    });
                }).catch(e => {
                    document.getElementById('vr-status').innerText = 'VR Start fehlgeschlagen: ' + e;
                    document.getElementById('vr-status').style.color = 'red';
                });
            });
        }

        function onXRFrame(time, frame) {
            const session = frame.session;
            session.requestAnimationFrame(onXRFrame);

            for (const source of session.inputSources) {
                if (source.handedness === 'right' && source.gripSpace && source.gamepad) {
                    const pose = frame.getPose(source.gripSpace, xrRefSpace);
                    if (!pose) continue;

                    const gp = source.gamepad;
                    const gripPressed  = gp.buttons[1]?.pressed || false;
                    const indexPressed = gp.buttons[0]?.pressed || false;
                    const thumbX = gp.axes[2] !== undefined ? gp.axes[2] : (gp.axes[0] || 0.0);

                    // Update debug display
                    document.getElementById('d-grip').innerText  = gripPressed  ? '🟢 GEDRÜCKT' : '⚪ LOS';
                    document.getElementById('d-index').innerText = indexPressed ? '🟢 GEDRÜCKT' : '⚪ LOS';
                    document.getElementById('d-thumb').innerText = thumbX.toFixed(3);
                    const p = pose.transform.position;
                    document.getElementById('d-pos').innerText =
                        `${p.x.toFixed(2)} / ${p.y.toFixed(2)} / ${p.z.toFixed(2)}`;

                    // Always send data so the ROS node knows current state
                    if (vrTopic && ros.isConnected) {
                        const msgData = {
                            position: { x: p.x, y: p.y, z: p.z },
                            orientation: {
                                x: pose.transform.orientation.x,
                                y: pose.transform.orientation.y,
                                z: pose.transform.orientation.z,
                                w: pose.transform.orientation.w
                            },
                            buttons: {
                                grip:  gripPressed,
                                index: indexPressed,
                                a: gp.buttons[4]?.pressed || false,
                                b: gp.buttons[5]?.pressed || false
                            },
                            axes: { x: thumbX }
                        };
                        vrTopic.publish(new ROSLIB.Message({ data: JSON.stringify(msgData) }));
                        msgCount++;
                        document.getElementById('d-count').innerText = msgCount;
                    }
                }
            }
        }

        // Start connecting immediately
        connectROS();
    </script>
</body>
</html>
