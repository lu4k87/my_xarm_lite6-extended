<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Quest 3 VR Teleop</title>
    <script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
    <style>
        body { font-family: monospace; background: #111; color: #eee; text-align: center; padding: 20px; margin: 0; }
        h1 { color: #4fc3f7; font-size: 22px; }
        .card { background: #1e1e1e; border-radius: 10px; padding: 14px; margin: 10px auto; max-width: 440px; text-align: left; }
        .row { display: flex; justify-content: space-between; margin: 4px 0; font-size: 14px; }
        .k { color: #888; }
        .v { font-weight: bold; }
        .ok { color: #66bb6a; } .warn { color: orange; } .err { color: #ef5350; }
        button {
            font-size: 18px; padding: 12px 24px; cursor: pointer;
            border-radius: 10px; border: none; background: #4fc3f7;
            color: #111; font-weight: bold; margin: 6px 4px;
        }
        button.red { background: #ef5350; color: #fff; }
        #log { font-size: 11px; color: #555; max-height: 80px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>Quest 3 Teleop</h1>

    <div class="card">
        <div class="row"><span class="k">ROS:</span><span class="v" id="s-ros">Verbinde...</span></div>
        <div class="row"><span class="k">VR Session:</span><span class="v" id="s-vr">–</span></div>
        <div class="row"><span class="k">InputSources (poll):</span><span class="v" id="s-inp">–</span></div>
        <div class="row"><span class="k">Event-Controller:</span><span class="v" id="s-evt">–</span></div>
        <div id="log"></div>
    </div>

    <button id="btn-vr" style="display:none" onclick="enterVR('immersive-vr')">▶ Enter VR</button>
    <button id="btn-ar" style="display:none" onclick="enterVR('immersive-ar')">▶ Passthrough</button>

    <div class="card" id="ctrl-card" style="display:none">
        <div class="row"><span class="k">Grip (Kupplung):</span><span class="v" id="d-grip">LOS</span></div>
        <div class="row"><span class="k">Index (Greifer):</span><span class="v" id="d-index">LOS</span></div>
        <div class="row"><span class="k">Thumbstick X:</span><span class="v" id="d-thumb">0.000</span></div>
        <div class="row"><span class="k">Position X/Y/Z:</span><span class="v" id="d-pos">–</span></div>
        <div class="row"><span class="k">Msgs gesendet:</span><span class="v ok" id="d-cnt">0</span></div>
    </div>

    <script>
    // ── State ────────────────────────────────────────────────────────
    let ros = null, vrTopic = null, xrSession = null, xrRefSpace = null;
    let gripActive = false, indexActive = false, thumbX = 0;
    let msgCount = 0, reconnectN = 0, reconnectTimer = null;
    let lastInputSrc = null;
    let posX=0, posY=0, posZ=0, oriX=0, oriY=0, oriZ=0, oriW=1;

    function log(txt) {
        const el = document.getElementById('log');
        el.innerHTML = txt + '<br>' + el.innerHTML;
    }

    // ── ROS ─────────────────────────────────────────────────────────
    function connectROS() {
        if (ros) try { ros.close(); } catch(e){}
        const host = (window.location.hostname && window.location.hostname !== '') ? window.location.hostname : '127.0.0.1';
        const rosUrl = 'ws://' + host + ':9090';
        log('Connecting ROS to ' + rosUrl + '...');
        setS('s-ros', 'Connecting (' + host + ':9090)...', 'warn');
        ros = new ROSLIB.Ros({ url: rosUrl });
        ros.on('connection', () => {
            reconnectN = 0; clearTimeout(reconnectTimer);
            setS('s-ros','Connected ✅ (' + host + ':9090)','ok');
            vrTopic = new ROSLIB.Topic({ ros, name: '/vr_teleop/controller_data', messageType: 'std_msgs/String' });
            checkXR();
        });
        ros.on('error', (err) => { 
            setS('s-ros','Error ❌ (' + rosUrl + ')','err'); 
            log('ROS error: ' + JSON.stringify(err));
            retry(); 
        });
        ros.on('close', () => { setS('s-ros','Closed 🔄','warn'); retry(); });
    }
    function retry() {
        reconnectN++;
        const d = Math.min(3000, 800 + reconnectN * 400);
        reconnectTimer = setTimeout(connectROS, d);
    }

    // ── WebXR ────────────────────────────────────────────────────────
    function checkXR() {
        if (!navigator.xr) { setS('s-vr','WebXR N/A','err'); return; }
        navigator.xr.isSessionSupported('immersive-vr').then(ok => {
            if (ok) document.getElementById('btn-vr').style.display='inline-block';
        });
        navigator.xr.isSessionSupported('immersive-ar').then(ok => {
            if (ok) document.getElementById('btn-ar').style.display='inline-block';
        });
        setS('s-vr','Ready – choose mode','warn');
    }

    function enterVR(mode) {
        log('Starting ' + mode + '...');
        navigator.xr.requestSession(mode, {
            requiredFeatures: [],
            optionalFeatures: ['local-floor','local','bounded-floor','hand-tracking']
        }).then(session => {
            xrSession = session;
            setS('s-vr', mode + ' ✅','ok');
            document.getElementById('ctrl-card').style.display='block';

            session.addEventListener('inputsourceschange', e => {
                const n = session.inputSources.length;
                setS('s-inp', n + ' source(s)', n>0?'ok':'warn');
                log('inputsourceschange: ' + n + ' sources');
            });

            session.addEventListener('squeezestart', e => {
                lastInputSrc = e.inputSource;
                gripActive = true;
                setS('s-evt','✅ GRIP aktiv ('+(e.inputSource.handedness||'gen')+')','ok');
                log('squeezestart: ' + e.inputSource.handedness);
                document.getElementById('d-grip').innerText = '🟢 GEDRÜCKT';
            });
            session.addEventListener('squeezeend', e => {
                gripActive = false;
                document.getElementById('d-grip').innerText = '⚪ LOS';
                publish();
            });

            session.addEventListener('selectstart', e => {
                lastInputSrc = e.inputSource;
                indexActive = true;
                setS('s-evt','✅ INDEX aktiv','ok');
                document.getElementById('d-index').innerText = '🟢 GEDRÜCKT';
                publish();
            });
            session.addEventListener('selectend', e => {
                indexActive = false;
                document.getElementById('d-index').innerText = '⚪ LOS';
                publish();
            });

            session.addEventListener('end', () => {
                xrSession=null; xrRefSpace=null; gripActive=false; indexActive=false;
                setS('s-vr','Ended','warn');
                document.getElementById('ctrl-card').style.display='none';
            });

            tryRefSpace(session, ['local-floor','local','viewer']);

        }).catch(e => {
            setS('s-vr','ERROR: '+e.message,'err');
            log('Session failed: '+e);
        });
    }

    function tryRefSpace(session, list) {
        if (!list.length) { log('All ref spaces failed!'); return; }
        session.requestReferenceSpace(list[0]).then(rs => {
            xrRefSpace = rs;
            log('RefSpace: ' + list[0]);
            session.requestAnimationFrame(onFrame);
        }).catch(() => tryRefSpace(session, list.slice(1)));
    }

    // ── Frame Loop ───────────────────────────────────────────────────
    function onFrame(time, frame) {
        const session = frame.session;
        session.requestAnimationFrame(onFrame);

        const sources = Array.from(session.inputSources);
        setS('s-inp', sources.length + ' src', sources.length>0?'ok':'warn');

        let found = null;
        for (const src of sources) {
            if (src.handedness === 'right') { found = src; break; }
            if (src.handedness === 'left' && !found) found = src;
            if (src.handedness === 'none' && !found) found = src;
        }
        if (!found && lastInputSrc) found = lastInputSrc;

        if (found) {
            const space = found.gripSpace || found.targetRaySpace;
            if (space && xrRefSpace) {
                const pose = frame.getPose(space, xrRefSpace);
                if (pose) {
                    posX = pose.transform.position.x;
                    posY = pose.transform.position.y;
                    posZ = pose.transform.position.z;
                    oriX = pose.transform.orientation.x;
                    oriY = pose.transform.orientation.y;
                    oriZ = pose.transform.orientation.z;
                    oriW = pose.transform.orientation.w;
                    document.getElementById('d-pos').innerText =
                        posX.toFixed(2)+' / '+posY.toFixed(2)+' / '+posZ.toFixed(2);
                }
            }

            const gp = found.gamepad;
            if (gp) {
                const gripBtn  = (gp.buttons[1]?.value > 0.5) || gp.buttons[1]?.pressed;
                const indexBtn = (gp.buttons[0]?.value > 0.5) || gp.buttons[0]?.pressed;
                thumbX = gp.axes[2] !== undefined ? gp.axes[2] : (gp.axes[0] || 0);

                if (gp.buttons[1] !== undefined) {
                    if (gripBtn !== gripActive) {
                        gripActive = gripBtn;
                        document.getElementById('d-grip').innerText = gripActive ? '🟢 GEDRÜCKT' : '⚪ LOS';
                    }
                }
                if (gp.buttons[0] !== undefined) {
                    if (indexBtn !== indexActive) {
                        indexActive = indexBtn;
                        document.getElementById('d-index').innerText = indexActive ? '🟢 GEDRÜCKT' : '⚪ LOS';
                    }
                }
                document.getElementById('d-thumb').innerText = thumbX.toFixed(3);
            }
        }

        // Publish on frame when active or thumbstick is moved
        if (gripActive || indexActive || Math.abs(thumbX) > 0.05) {
            publish();
        }
    }

    // ── Publish to ROS ────────────────────────────────────────────────
    function publish() {
        if (!vrTopic) return;
        vrTopic.publish(new ROSLIB.Message({
            data: JSON.stringify({
                position: {x:posX, y:posY, z:posZ},
                orientation: {x:oriX, y:oriY, z:oriZ, w:oriW},
                buttons: { grip: gripActive, index: indexActive, a:false, b:false },
                axes: { x: thumbX }
            })
        }));
        msgCount++;
        document.getElementById('d-cnt').innerText = msgCount;
    }

    function setS(id, text, cls) {
        const el = document.getElementById(id);
        el.innerText = text;
        el.className = 'v ' + (cls||'');
    }

    connectROS();
    </script>
</body>
</html>
