<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Quest 3 VR Teleop</title>
    <script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
    <style>
        body { font-family: monospace; background: #111; color: #eee; text-align: center; padding: 20px; margin: 0; }
        h1 { color: #4fc3f7; font-size: 24px; }
        .card { background: #1e1e1e; border-radius: 10px; padding: 16px; margin: 12px auto; max-width: 420px; text-align: left; }
        .row { display: flex; justify-content: space-between; margin: 5px 0; font-size: 15px; }
        .k { color: #888; }
        .v { font-weight: bold; }
        .ok { color: #66bb6a; }
        .warn { color: orange; }
        .err { color: #ef5350; }
        button {
            font-size: 20px; padding: 14px 28px; cursor: pointer;
            border-radius: 10px; border: none; background: #4fc3f7;
            color: #111; font-weight: bold; margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Quest 3 Teleop</h1>

    <div class="card">
        <div class="row"><span class="k">ROS (Port 9090):</span><span class="v" id="s-ros">Verbinde...</span></div>
        <div class="row"><span class="k">VR Session:</span><span class="v" id="s-vr">–</span></div>
        <div class="row"><span class="k">Input Sources:</span><span class="v" id="s-inputs">0</span></div>
        <div class="row"><span class="k">Ref Space:</span><span class="v" id="s-ref">–</span></div>
        <div id="s-info" style="font-size:12px;color:#555;margin-top:6px;"></div>
    </div>

    <button id="vr-btn" style="display:none;" onclick="enterVR()">▶ Enter VR</button>

    <div class="card" id="ctrl-card" style="display:none;">
        <div class="row"><span class="k">🖐 Grip (Kupplung):</span><span class="v" id="d-grip">LOS</span></div>
        <div class="row"><span class="k">☝ Index (Greifer):</span><span class="v" id="d-index">LOS</span></div>
        <div class="row"><span class="k">🕹 Thumbstick X:</span><span class="v" id="d-thumb">0.00</span></div>
        <div class="row"><span class="k">📍 Position:</span><span class="v" id="d-pos">–</span></div>
        <div class="row"><span class="k">📨 Msgs gesendet:</span><span class="v ok" id="d-count">0</span></div>
    </div>

    <script>
        let ros = null;
        let vrTopic = null;
        let xrSession = null;
        let xrRefSpace = null;
        let msgCount = 0;
        let reconnectTimer = null;
        let reconnectN = 0;

        // ── ROS Connection with auto-retry ─────────────────────────────
        function connectROS() {
            if (ros) { try { ros.close(); } catch(e){} }
            ros = new ROSLIB.Ros({ url: 'ws://127.0.0.1:9090' });

            ros.on('connection', () => {
                reconnectN = 0;
                clearTimeout(reconnectTimer);
                setStatus('s-ros', 'Verbunden ✅', 'ok');
                setInfo('');
                vrTopic = new ROSLIB.Topic({
                    ros, name: '/vr_teleop/controller_data',
                    messageType: 'std_msgs/String'
                });
                checkXR();
            });

            ros.on('error', () => {
                setStatus('s-ros', 'Fehler ❌', 'err');
                retry();
            });

            ros.on('close', () => {
                setStatus('s-ros', 'Getrennt 🔄', 'warn');
                retry();
            });
        }

        function retry() {
            reconnectN++;
            const d = Math.min(3000, 1000 + reconnectN * 500);
            setInfo(`Reconnect in ${Math.round(d/1000)}s... (Versuch ${reconnectN})`);
            reconnectTimer = setTimeout(connectROS, d);
        }

        // ── WebXR Support Check ─────────────────────────────────────────
        function checkXR() {
            if (!navigator.xr) {
                setStatus('s-vr', 'WebXR nicht verfügbar', 'err');
                return;
            }
            // Prefer AR (passthrough), fall back to VR
            navigator.xr.isSessionSupported('immersive-ar').then(arOk => {
                if (arOk) {
                    document.getElementById('vr-btn').innerText = '▶ Enter Passthrough';
                    document.getElementById('vr-btn').dataset.mode = 'immersive-ar';
                } else {
                    document.getElementById('vr-btn').innerText = '▶ Enter VR';
                    document.getElementById('vr-btn').dataset.mode = 'immersive-vr';
                }
                document.getElementById('vr-btn').style.display = 'inline-block';
                setStatus('s-vr', 'Bereit – Button drücken', 'warn');
            });
        }

        // ── Start XR Session ────────────────────────────────────────────
        function enterVR() {
            const mode = document.getElementById('vr-btn').dataset.mode || 'immersive-vr';
            setInfo('Starte ' + mode + '...');

            navigator.xr.requestSession(mode, {
                requiredFeatures: [],                     // nothing required – most compatible
                optionalFeatures: ['local-floor', 'local', 'hand-tracking']
            }).then(session => {
                xrSession = session;
                setStatus('s-vr', mode + ' aktiv ✅', 'ok');
                document.getElementById('ctrl-card').style.display = 'block';
                session.addEventListener('end', () => {
                    xrSession = null;
                    xrRefSpace = null;
                    setStatus('s-vr', 'Session beendet', 'warn');
                    document.getElementById('ctrl-card').style.display = 'none';
                });

                // Try local-floor → local → viewer as fallback
                session.requestReferenceSpace('local-floor')
                    .catch(() => session.requestReferenceSpace('local'))
                    .catch(() => session.requestReferenceSpace('viewer'))
                    .then(refSpace => {
                        xrRefSpace = refSpace;
                        setStatus('s-ref', refSpace.toString().includes('floor') ? 'local-floor' : 'local', 'ok');
                        session.requestAnimationFrame(onXRFrame);
                    });

            }).catch(e => {
                setStatus('s-vr', 'Fehler: ' + e.message, 'err');
                setInfo('Tipp: Controller einschalten, Brille aufsetzen, nochmal klicken');
            });
        }

        // ── XR Frame Loop ───────────────────────────────────────────────
        function onXRFrame(time, frame) {
            const session = frame.session;
            session.requestAnimationFrame(onXRFrame);

            const sources = Array.from(session.inputSources);
            document.getElementById('s-inputs').innerText = sources.length;

            for (const src of sources) {
                if (src.handedness === 'right') {
                    const gp = src.gamepad;
                    const gripSp = src.gripSpace;

                    if (!gp) continue;

                    const grip  = gp.buttons[1]?.pressed || false;
                    const index = gp.buttons[0]?.pressed || false;
                    const thumbX = (gp.axes.length > 2 ? gp.axes[2] : (gp.axes[0] || 0));

                    document.getElementById('d-grip').innerText  = grip  ? '🟢 GEDRÜCKT' : '⚪ LOS';
                    document.getElementById('d-grip').className  = 'v ' + (grip ? 'ok' : '');
                    document.getElementById('d-index').innerText = index ? '🟢 GEDRÜCKT' : '⚪ LOS';
                    document.getElementById('d-thumb').innerText = thumbX.toFixed(3);

                    let posX = 0, posY = 0, posZ = 0;
                    let ori = {x:0,y:0,z:0,w:1};

                    if (gripSp && xrRefSpace) {
                        const pose = frame.getPose(gripSp, xrRefSpace);
                        if (pose) {
                            posX = pose.transform.position.x;
                            posY = pose.transform.position.y;
                            posZ = pose.transform.position.z;
                            ori  = pose.transform.orientation;
                        }
                    }

                    document.getElementById('d-pos').innerText =
                        `${posX.toFixed(2)} / ${posY.toFixed(2)} / ${posZ.toFixed(2)}`;

                    // Publish regardless of grip so ROS node sees all state
                    if (vrTopic) {
                        vrTopic.publish(new ROSLIB.Message({
                            data: JSON.stringify({
                                position: {x: posX, y: posY, z: posZ},
                                orientation: ori,
                                buttons: { grip, index,
                                    a: gp.buttons[4]?.pressed || false,
                                    b: gp.buttons[5]?.pressed || false },
                                axes: { x: thumbX }
                            })
                        }));
                        msgCount++;
                        document.getElementById('d-count').innerText = msgCount;
                    }
                }
            }
        }

        // ── Helpers ─────────────────────────────────────────────────────
        function setStatus(id, text, cls) {
            const el = document.getElementById(id);
            el.innerText = text;
            el.className = 'v ' + (cls || '');
        }
        function setInfo(text) {
            document.getElementById('s-info').innerText = text;
        }

        connectROS();
    </script>
</body>
</html>
