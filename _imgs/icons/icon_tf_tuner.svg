<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Outer Rounded Container -->
  <rect x="9" y="16" width="82" height="68" rx="9" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />

  <!-- Mask for the knob holes -->
  <mask id="knob-cutout">
    <rect width="100" height="100" fill="#ffffff" />
    <circle cx="44" cy="33" r="3.2" fill="#000000" />
    <circle cx="61" cy="50" r="3.2" fill="#000000" />
    <circle cx="37" cy="67" r="3.2" fill="#000000" />
  </mask>

  <!-- Slider Tracks and Knobs -->
  <g mask="url(#knob-cutout)">
    <line x1="23" y1="33" x2="77" y2="33" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="23" y1="50" x2="77" y2="50" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="23" y1="67" x2="77" y2="67" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <circle cx="44" cy="33" r="5.2" fill="none" stroke="#ffffff" stroke-width="4" />
    <circle cx="61" cy="50" r="5.2" fill="none" stroke="#ffffff" stroke-width="4" />
    <circle cx="37" cy="67" r="5.2" fill="none" stroke="#ffffff" stroke-width="4" />
  </g>
</svg>