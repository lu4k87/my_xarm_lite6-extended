<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <g transform="translate(50, 36) scale(0.93) translate(-50, -38)">
    <!-- Stick-Basis (Draufsicht): Außenring + Stick-Kappe -->
    <g fill="none" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="50" cy="39" r="34" />
      <circle cx="50" cy="39" r="15.5" />
    </g>

    <!-- Filled Elements: Griffmulde der Kappe & 4 Richtungspfeile -->
    <g fill="#ffffff" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round">
      <circle cx="50" cy="39" r="8.5" />
      <path d="M 50 10.5 L 56 17.5 L 44 17.5 Z" />
      <path d="M 50 67.5 L 56 60.5 L 44 60.5 Z" />
      <path d="M 21.5 39 L 28.5 33 L 28.5 45 Z" />
      <path d="M 78.5 39 L 71.5 33 L 71.5 45 Z" />
    </g>
  </g>

  <!-- Typography: "Analog Stick" -->
  <text x="50" y="90.5" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="11.9" fill="#ffffff" textLength="80" lengthAdjust="spacingAndGlyphs">Analog Stick</text>
</svg>
