<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROS 2 Nexus — Web Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #02040a; --surf: #080c16; --card: #0c1425; --btn: #121d33;
  --brd: #1a2c4e; --hov: #1e3a5f; --txt: #e2e8f0; --mut: #64748b;
  --cy: #38bdf8; --gr: #10b981; --am: #fbbf24; --red: #e11d48;
  --pur: #9333ea; --ind: #4f46e5; --sky: #0284c7;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--txt); font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }

/* ── Header ── */
header { background: var(--surf); border-bottom: 1px solid var(--brd); padding: 0 24px; height: 60px; display: flex; align-items: center; gap: 20px; position: sticky; top: 0; z-index: 100; }
.logo { display: flex; align-items: center; gap: 10px; min-width: 200px; }
.logo-name { font-size: 17px; font-weight: 800; letter-spacing: -0.3px; }
.logo-badge { font-size: 10px; font-weight: 700; background: var(--btn); color: var(--cy); border: 1px solid var(--brd); padding: 2px 8px; border-radius: 99px; }
.tab-nav { display: flex; gap: 4px; flex: 1; justify-content: center; }
.tab-btn { background: transparent; border: 1px solid transparent; color: var(--mut); font-family: 'Inter'; font-size: 13px; font-weight: 600; padding: 8px 22px; border-radius: 8px; cursor: pointer; transition: all .15s; }
.tab-btn:hover { background: var(--btn); color: var(--txt); border-color: var(--brd); }
.tab-btn.active { background: var(--cy); color: #020617; border-color: transparent; }
.status { display: flex; align-items: center; gap: 8px; min-width: 140px; justify-content: flex-end; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--mut); transition: .3s; }
.dot.ok { background: var(--gr); box-shadow: 0 0 8px var(--gr); }
.stxt { font-size: 11px; color: var(--mut); font-family: 'JetBrains Mono'; }

/* ── Main ── */
main { flex: 1; padding: 24px 28px; max-width: 880px; margin: 0 auto; width: 100%; }
.panel { display: none; } .panel.on { display: block; }

/* ── Sections ── */
.section { background: var(--card); border: 1px solid var(--brd); border-radius: 14px; padding: 14px 16px; margin-bottom: 20px; }
.section-title { color: var(--mut); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; padding: 0 4px 10px; }

/* ── Action Buttons ── */
.action-row { display: flex; gap: 6px; margin-bottom: 6px; }
.action-btn { flex: 1; display: flex; align-items: center; background: var(--btn); border: 1px solid var(--brd); border-radius: 10px; padding: 10px 14px; cursor: pointer; transition: all .15s; min-height: 46px; }
.action-btn:hover { background: var(--hov); border-color: var(--cy); }
.action-btn:active { transform: scale(0.98); }
.action-btn .label { font-size: 14px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.action-btn .cmd-text { font-family: 'JetBrains Mono'; font-size: 11px; color: #475569; margin-right: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 340px; text-align: right; }
.badge { font-size: 10px; font-weight: 700; color: #fff; padding: 3px 10px; border-radius: 5px; text-transform: uppercase; letter-spacing: 0.5px; flex-shrink: 0; }
.badge-node { background: var(--sky); }
.badge-launch { background: var(--gr); }
.badge-sys { background: var(--pur); }
.badge-kill { background: var(--red); }
.copy-btn { width: 36px; height: 44px; display: flex; align-items: center; justify-content: center; background: var(--btn); border: 1px solid var(--brd); border-radius: 10px; cursor: pointer; color: var(--mut); font-size: 16px; transition: all .15s; flex-shrink: 0; }
.copy-btn:hover { background: var(--hov); color: var(--cy); border-color: var(--cy); }

/* ── Footer ── */
footer { background: var(--surf); border-top: 1px solid var(--brd); padding: 12px 24px; display: flex; justify-content: center; gap: 12px; }
.footer-btn { background: var(--ind); color: #fff; border: 1px solid var(--brd); border-radius: 8px; padding: 10px 22px; font-family: 'Inter'; font-size: 13px; font-weight: 700; cursor: pointer; transition: all .15s; }
.footer-btn:hover { background: #4338ca; }

/* ── Toast ── */
.toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--gr); color: #020617; padding: 10px 24px; border-radius: 10px; font-size: 13px; font-weight: 700; opacity: 0; transition: opacity .3s; z-index: 999; pointer-events: none; }
.toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span style="font-size:20px;">🤖</span>
    <span class="logo-name">ROS 2 Nexus</span>
    <span class="logo-badge">WEB</span>
  </div>
  <nav class="tab-nav" id="tab-nav">
    <button class="tab-btn active" data-tab="robot">Roboter</button>
    <button class="tab-btn" data-tab="nodes">Nodes / Launch</button>
    <button class="tab-btn" data-tab="web">Web</button>
    <button class="tab-btn" data-tab="info">ROS Info</button>
    <button class="tab-btn" data-tab="system">System</button>
  </nav>
  <div class="status">
    <div class="dot" id="status-dot"></div>
    <span class="stxt" id="status-text">Offline</span>
  </div>
</header>

<main id="main-content"></main>

<footer>
  <button class="footer-btn" onclick="runCmd('nano ~/.bashrc', '~/.bashrc Editor', 'interactive')">~/.bashrc</button>
  <button class="footer-btn" onclick="runCmd('nano ~/dev_ws/_exec/ros2_nexus.py', 'App Code', 'interactive')">App Code</button>
  <button class="footer-btn" onclick="location.reload()">App Reload</button>
</footer>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════════
//  TAB DATA — identisch mit ros2_nexus.py
// ══════════════════════════════════════════════════════
const TABS = {
  robot: [
    { title: "Hardware", actions: [
      { label: "Real Move Launch", cmd: "ros2 launch xarm_moveit_servo lite6_moveit_servo_realmove.launch.py robot_ip:=192.168.1.175 add_gripper:=true report_type:=dev", type: "launch" },
      { label: "Fake Move Launch", cmd: "ros2 launch xarm_moveit_servo lite6_moveit_servo_fake.launch.py add_gripper:=true", type: "launch" },
      { label: "Keyboard Input", cmd: "ros2 run xarm_moveit_servo xarm_keyboard_input", type: "node" },
    ]},
  ],
  nodes: [
    { title: "Planung & Logik", actions: [
      { label: "Move To Coordinator", cmd: "ros2 run move_to_coordinator move_to_coordinator", type: "node" },
      { label: "Motion Sequence Launch", cmd: "ros2 launch motion_sequence motion_sequence_launch.py", type: "launch" },
      { label: "Collision Check Node", cmd: "ros2 run collision_check checker", type: "node" },
    ]},
    { title: "Vision & Eye-Tracking", actions: [
      { label: "Eye UI Node", cmd: "ros2 run eye_control eye_ui", type: "node" },
      { label: "YOLO Homographie", cmd: "ros2 run yolo_object_detector yolo_homography_node", type: "node" },
      { label: "RViz Marker Launch", cmd: "ros2 launch rviz_marker rviz_marker.launch.py", type: "launch" },
    ]},
    { title: "Sprache & Audio", actions: [
      { label: "Whisper Bringup", cmd: "ros2 launch whisper_bringup bringup.launch.py silero_vad_use_cuda:=True", type: "launch" },
      { label: "Whisper Stream Demo", cmd: "ros2 run whisper_demos whisper_on_key", type: "node" },
      { label: "Voice Command Listener", cmd: "ros2 run voice_command_listener listener", type: "node" },
    ]},
  ],
  web: [
    { title: "Backend & Server", actions: [
      { label: "ROS Bridge Launch", cmd: "ros2 launch rosbridge_server rosbridge_websocket_launch.xml", type: "launch" },
      { label: "Webserver Port 8080", cmd: "python3 -m http.server 8080 -d src/websocket", type: "sys" },
      { label: "Workspace Analyzer", cmd: "python3 src/websocket/workspace_analyzer.py", type: "sys" },
    ]},
    { title: "Frontend & Browser", actions: [
      { label: "Dashboard öffnen", cmd: "xdg-open http://localhost:8080/dashboard_index.html", type: "sys", mode: "bg" },
      { label: "OBS Studio", cmd: "obs", type: "sys" },
    ]},
  ],
  info: [
    { title: "Listen & Status", actions: [
      { label: "Aktive Nodes", cmd: "ros2 node list", type: "sys" },
      { label: "Aktive Topics", cmd: "ros2 topic list -t", type: "sys" },
      { label: "Services", cmd: "ros2 service list", type: "sys" },
      { label: "Parameter", cmd: "ros2 param list", type: "sys" },
      { label: "Alle Pakete", cmd: "ros2 pkg list", type: "sys" },
    ]},
    { title: "Visualisierung", actions: [
      { label: "RViz2", cmd: "rviz2", type: "launch" },
      { label: "RQT Graph", cmd: "rqt_graph", type: "sys" },
      { label: "RQT", cmd: "rqt", type: "sys" },
    ]},
    { title: "Live-Debugging", actions: [
      { label: "Topic Echo", cmd: 'read -p "Topic: " tp; ros2 topic echo $tp', type: "sys", mode: "interactive" },
      { label: "Topic Hz", cmd: 'read -p "Topic: " tp; ros2 topic hz $tp', type: "sys", mode: "interactive" },
      { label: "Interface Aufbau", cmd: 'read -p "Message-Typ: " msg; ros2 interface show $msg; echo ""; read -p "Enter..."', type: "sys", mode: "interactive" },
      { label: "ros2 doctor", cmd: "ros2 doctor", type: "sys" },
    ]},
  ],
  system: [
    { title: "Controller (Joy)", actions: [
      { label: "Pub /joy", cmd: 'ros2 topic pub --rate 10 /joy sensor_msgs/msg/Joy "{header: {stamp: {sec: 0, nanosec: 0}, frame_id: \'base_link\'}, axes: [0.0, 1.0, 0.0, 0.0], buttons: [0, 0, 0, 0]}"', type: "node" },
      { label: "Pub /joy_check", cmd: 'ros2 topic pub --rate 10 /joy_check sensor_msgs/msg/Joy "{header: {stamp: {sec: 0, nanosec: 0}, frame_id: \'base_link\'}, axes: [0.0, 1.0, 0.0, 0.0], buttons: [0, 0, 0, 0]}"', type: "node" },
    ]},
    { title: "Netzwerk & System", actions: [
      { label: "Eigene IP anzeigen", cmd: "echo -e '\\033[1;32mNetzwerk:\\033[0m'; ip -brief address show; echo ''; read -p 'Enter...'", type: "sys", mode: "interactive" },
      { label: "Datei suchen", cmd: 'read -p "Dateiname?: " st; find / -iname "*${st}*" 2>/dev/null', type: "sys", mode: "interactive" },
    ]},
    { title: "Umgebung & Build", actions: [
      { label: "bashrc neu laden", cmd: "source ~/.bashrc && echo -e '\\033[1;32m.bashrc geladen!\\033[0m'; sleep 2", type: "sys", mode: "interactive" },
      { label: "dev_ws → colcon build", cmd: "colcon build --symlink-install", type: "sys" },
    ]},
    { title: "Notfall", actions: [
      { label: "ALLE ROS-Prozesse beenden", cmd: "pkill -9 -f 'rosbridge_server' && pkill -9 -f 'rosbridge_websocket' && pkill -9 -f 'rosapi_node' && pkill -9 -f 'workspace_analyzer' && pkill -9 -f 'lite6' && pkill -9 -f 'http.server'", type: "kill", mode: "bg" },
    ]},
  ],
};

// ══════════════════════════════════════════════════════
//  RENDERING
// ══════════════════════════════════════════════════════
const badgeClass = { node: 'badge-node', launch: 'badge-launch', sys: 'badge-sys', kill: 'badge-kill' };
const badgeLabel = { node: 'NODE', launch: 'LAUNCH', sys: 'CMD', kill: 'KILL' };

function renderTab(tabId) {
  const sections = TABS[tabId] || [];
  let html = '';
  sections.forEach(sec => {
    html += `<div class="section"><div class="section-title">${sec.title}</div>`;
    sec.actions.forEach(a => {
      const displayCmd = a.cmd.length > 55 ? a.cmd.slice(0, 52) + '...' : a.cmd;
      const mode = a.mode || 'ros';
      const bc = badgeClass[a.type] || 'badge-sys';
      const bl = badgeLabel[a.type] || 'CMD';
      html += `
        <div class="action-row">
          <div class="action-btn" onclick="runCmd('${a.cmd.replace(/'/g, "\\'")}', '${a.label}', '${mode}')" title="${a.cmd}">
            <span class="label">${a.label}</span>
            <span class="cmd-text">${displayCmd}</span>
            <span class="badge ${bc}">${bl}</span>
          </div>
          <div class="copy-btn" onclick="copyCmd('${a.cmd.replace(/'/g, "\\'")}', this)" title="Befehl kopieren">⧉</div>
        </div>`;
    });
    html += '</div>';
  });
  document.getElementById('main-content').innerHTML = html;
}

// ══════════════════════════════════════════════════════
//  TAB SWITCHING
// ══════════════════════════════════════════════════════
let currentTab = 'robot';
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    renderTab(currentTab);
  });
});

// ══════════════════════════════════════════════════════
//  BACKEND COMMUNICATION
// ══════════════════════════════════════════════════════
async function runCmd(command, title, mode = 'ros') {
  try {
    const res = await fetch('/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ command, title, mode })
    });
    const data = await res.json();
    if (data.ok) {
      showToast(`✓ ${title}`);
    } else {
      showToast(`✗ ${data.error}`, true);
    }
  } catch (e) {
    showToast('✗ Backend nicht erreichbar', true);
  }
}

function copyCmd(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓';
    btn.style.color = 'var(--gr)';
    setTimeout(() => { btn.textContent = '⧉'; btn.style.color = ''; }, 1200);
  });
}

function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isError ? 'var(--red)' : 'var(--gr)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ══════════════════════════════════════════════════════
//  STATUS PING
// ══════════════════════════════════════════════════════
async function checkStatus() {
  try {
    const res = await fetch('/api/ping');
    const data = await res.json();
    document.getElementById('status-dot').classList.toggle('ok', data.ok);
    document.getElementById('status-text').textContent = data.ok ? 'Online' : 'Offline';
  } catch {
    document.getElementById('status-dot').classList.remove('ok');
    document.getElementById('status-text').textContent = 'Offline';
  }
}

// ══════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════
renderTab('robot');
checkStatus();
setInterval(checkStatus, 5000);
</script>
</body>
</html>
